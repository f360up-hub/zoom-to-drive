name: Zoom Large Recording Test

on:
  workflow_dispatch:
    inputs:
      meeting_id:
        description: "Zoom meeting ID"
        required: true
        type: string

      file_name:
        description: "File name"
        required: true
        default: "zoom-recording.mp4"
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Get Zoom access token
        id: zoom_token
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS -X POST \
            "https://zoom.us/oauth/token?grant_type=account_credentials&account_id=${ZOOM_ACCOUNT_ID}" \
            -u "${ZOOM_CLIENT_ID}:${ZOOM_CLIENT_SECRET}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Get recording details
        id: recording
        env:
          ACCESS_TOKEN: ${{ steps.zoom_token.outputs.access_token }}
          MEETING_ID: ${{ inputs.meeting_id }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://api.zoom.us/v2/meetings/${MEETING_ID}/recordings")

          echo "$RESPONSE" | python3 -m json.tool

          DOWNLOAD_URL=$(echo "$RESPONSE" | python3 -c "
          import sys,json

          data=json.load(sys.stdin)
          files=data.get('recording_files', [])

          video=[]

          for f in files:
              print(
                  'TYPE=', f.get('file_type'),
                  'EXT=', f.get('file_extension'),
                  'REC_TYPE=', f.get('recording_type'),
                  file=sys.stderr
              )

              if str(f.get('file_extension','')).lower() == 'mp4':
                  video.append(f)

          if not video:
              raise SystemExit('No MP4 recording found')

          print(video[0]['download_url'])
          ")

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Download Zoom recording
        env:
          ACCESS_TOKEN: ${{ steps.zoom_token.outputs.access_token }}
          DOWNLOAD_URL: ${{ steps.recording.outputs.download_url }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 10 \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${DOWNLOAD_URL}" \
            -o "${FILE_NAME}"

          echo "Download completed"
          ls -lh "${FILE_NAME}"
          file "${FILE_NAME}"
